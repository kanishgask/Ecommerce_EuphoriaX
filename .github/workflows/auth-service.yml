name: CI - Auth Service

on:
  push:
    paths:
      - 'backend/auth-service/**'
      - '.github/workflows/auth-service.yml'
    branches:
      - ci-cd
      - main
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/reusable-backend-ci.yml
    with:
      service_name: auth-service
      service_path: backend/auth-service
    secrets: inherit
