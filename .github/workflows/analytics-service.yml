name: CI - Analytics Service

on:
  push:
    paths:
      - 'backend/analytics-service/**'
      - '.github/workflows/analytics-service.yml'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/reusable-backend-ci.yml
    with:
      service_name: analytics-service
      service_path: backend/analytics-service
