name: EuphoriaX Full-Stack CI/CD Pipeline

on:
  push:
    branches:
      - main
      - devops-integration

  pull_request:
    branches:
      - main

jobs:
  #########################################################
  # FRONTEND CI 
  #########################################################
  frontend-ci:
    name: Frontend CI (Build & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.euphoriax.com

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  #########################################################
  # BACKEND CI
  #########################################################
  backend-ci:
    name: Backend CI (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - product-service
          - cart-service
          - order-service
          - inventory-service
          - notification-service
          - payment-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        working-directory: backend/backend/${{ matrix.service }}
        run: npm ci

      - name: Run Unit Tests
        working-directory: backend/backend/${{ matrix.service }}
        run: npm test
        env:
          NODE_ENV: test
          PORT: 4000
          AWS_REGION: ap-southeast-1

  #########################################################
  # FRONTEND CD
  #########################################################
  deploy-frontend:
    name: Deploy Frontend to S3
    needs:
      - frontend-ci
      - backend-ci

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy to S3
        run: |
          echo "Deploying frontend..."
          echo "Replace with:"
          echo "aws s3 sync ./dist s3://YOUR_BUCKET_NAME --delete"

      - name: Invalidate CloudFront
        run: |
          echo "Invalidating CloudFront..."
          echo "Replace with:"
          echo "aws cloudfront create-invalidation --distribution-id YOUR_DISTRIBUTION_ID --paths '/*'"

  #########################################################
  # BACKEND CD
  #########################################################
  deploy-backend:
    name: Deploy Backend
    needs:
      - frontend-ci
      - backend-ci

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          
          aws-region: ap-southeast-1

      - name: Deploy Backend
        run: |
          echo "Backend deployment successful."
          echo "Replace this with Lambda deployment commands."
