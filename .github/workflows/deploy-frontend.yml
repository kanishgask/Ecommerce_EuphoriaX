name: Deploy - Frontend

on:
  workflow_run:
    workflows: ["CI - Frontend"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and Deploy Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          
          # Sync to S3
          aws s3 sync dist/ s3://euphoriaxbucket --delete
          
          # Find Distribution ID from domain name and invalidate
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?DomainName=='d3o04910qsjznl.cloudfront.net'].Id" --output text)
          
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
          else
            echo "Failed to find CloudFront Distribution ID for d3o04910qsjznl.cloudfront.net"
            exit 1
          fi
