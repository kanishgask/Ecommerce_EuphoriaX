name: Reusable Backend Deploy

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false
      AWS_REGION:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ inputs.service_name }}
      cancel-in-progress: false
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ inputs.service_name }}
          path: .
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}
        
      - name: Update Lambda Code with Retries
        run: |
          FUNCTION_NAME="euphoriax-${{ inputs.service_name }}"
          echo "Checking if Lambda Function exists: $FUNCTION_NAME"
          
          if ! aws lambda get-function --function-name $FUNCTION_NAME > /dev/null 2>&1; then
            echo "::warning title=AWS Lab Reset Detected!::Lambda function $FUNCTION_NAME does not exist. Please trigger the Terraform workflow to rebuild your cloud environment before deploying."
            echo "Skipping deployment because the infrastructure is missing."
            exit 0
          fi
          
          echo "Updating Lambda Function: $FUNCTION_NAME"
          
          n=0
          max_retries=3
          until [ "$n" -ge "$max_retries" ]
          do
             aws lambda update-function-code --function-name $FUNCTION_NAME --zip-file fileb://function.zip && break
             n=$((n+1))
             echo "Failed to update function. Retrying in 10s ($n/$max_retries)..."
             sleep 10
          done
          
          if [ "$n" -ge "$max_retries" ]; then
            echo "Failed to update Lambda after $max_retries attempts."
            exit 1
          fi

      - name: Wait for Lambda Deployment to Stabilize
        run: |
          FUNCTION_NAME="euphoriax-${{ inputs.service_name }}"
          echo "Waiting for $FUNCTION_NAME update to complete..."
          aws lambda wait function-updated-v2 --function-name $FUNCTION_NAME || echo "Wait failed, but update was successful"

      - name: Print Deployment Summary
        run: echo "Deployment of ${{ inputs.service_name }} completed successfully!"
